<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | MUST Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <aside class="brand">
      <header class="logo">
        <img src="images/must_logo.png" alt="Mbarara University logo" class="logo-img">
      </header>
      <section>
        <h2>Create your portal account.</h2>
        <p>Register with your university email and registration number to get started.</p>
      </section>
      <footer><small>&copy; 2026 Mbarara University of Science and Technology.</small></footer>
    </aside>

    <main class="panel">
      <section class="card">
        <h1>Create account</h1>
        <p class="sub">It takes about two minutes.</p>

        <form action="#" method="post">
          <label for="fullname">Full name</label>
          <input id="fullname" name="fullname" type="text" autocomplete="name" required>

          <label for="email">University email</label>
          <input id="email" name="email" type="email" placeholder="name@must.ac.ug" autocomplete="email" required>

          <label for="regno">Registration number</label>
          <input id="regno" name="regno" type="text" autocomplete="off" required>

          <label for="phone">Phone number</label>
          <input id="phone" name="phone" type="tel" placeholder="+256 7XX XXX XXX" autocomplete="tel">

          <label for="password">Password</label>
          <input id="password" name="password" type="password" minlength="8"
                 pattern="(?=.*\d)(?=.*[A-Za-z]).{8,}"
                 title="At least 8 characters, with letters and a number"
                 autocomplete="new-password" required>
          <small class="hint">At least 8 characters, with letters and a number.</small>

          <label for="confirm">Confirm password</label>
          <input id="confirm" name="confirm" type="password" minlength="8"
                 autocomplete="new-password" required>

          <label class="check"><input type="checkbox" name="terms" required> I agree to the university terms of use</label>

          <button type="submit">Create account</button>
        </form>

        <p class="switch">Already have an account? <a href="index.html">Sign in</a></p>
      </section>
    </main>
  </div>
</body>
</html>
