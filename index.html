<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | MUST Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <aside class="brand">
      <header class="logo"><span class="mark"></span>MUST Portal</header>
      <section>
        <h2>Welcome to the Student and Staff Portal.</h2>
        <p>Sign in to access your courses, results, timetable and university services.</p>
      </section>
      <footer><small>© 2026 Mbarara University of Science and Technology.</small></footer>
    </aside>

    <main class="panel">
      <section class="card">
        <h1>Sign in</h1>
        <p class="sub">Use your university email and password.</p>

        <form action="#" method="post">
          <label for="email">University email</label>
          <input id="email" name="email" type="email" placeholder="name@must.ac.ug" required>

          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Enter your password" minlength="8" required>

          <label class="check"><input type="checkbox" name="remember"> Keep me signed in on this device</label>

          <button type="submit">Sign in</button>
        </form>

        <p class="switch">New to the portal? <a href="signup.html">Create an account</a></p>
      </section>
    </main>
  </div>
</body>
</html>
